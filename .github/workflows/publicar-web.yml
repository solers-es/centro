name: Publicar Centro (Hetzner)

# AUTOMATICO al fusionar/empujar a main + boton. El Centro (centro.solers.es, dinero.service) se
# despliega desde el repo SIN tocar los datos vivos (chat.json, tickets.json, obra.json, cerrados.json)
# y con ROLLBACK: si tras reiniciar no responde /salud, restaura el server.mjs anterior.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Bajar el codigo de main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Preparar la llave del servidor
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H 91.99.92.242 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Subir el codigo a staging
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no root@91.99.92.242 "mkdir -p /srv/staging/centro"
          rsync -az --delete \
            --exclude .git --exclude .github --exclude node_modules --exclude supabase --exclude .gitignore \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no" \
            ./ root@91.99.92.242:/srv/staging/centro/

      - name: Publicar (preservando datos + rollback)
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no root@91.99.92.242 "bash /root/publicar-centro.sh"
