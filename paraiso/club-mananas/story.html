<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,600&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--cafe:#361F12;--cafe2:#6F4A2E;--dorado:#C4852A;--dorado2:#E7B65A;--verde:#2E7D32;--rojo:#E0541F}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{font-family:'Poppins',sans-serif;position:relative;color:#fff}
  .bg{position:absolute;inset:0}
  .bg img{width:100%;height:100%;object-fit:cover;object-position:center 42%}
  .scrim{position:absolute;inset:0;background:
    linear-gradient(180deg,rgba(40,21,9,.72) 0%,rgba(40,21,9,.18) 30%,rgba(40,21,9,.35) 55%,rgba(26,13,5,.94) 100%)}
  .wrap{position:absolute;inset:0;padding:90px 70px 96px;display:flex;flex-direction:column;align-items:center;text-align:center;z-index:2}
  .logobadge{width:150px;height:150px;background:#fff;border-radius:50%;display:grid;place-items:center;border:4px solid rgba(231,182,90,.75);box-shadow:0 12px 28px rgba(0,0,0,.4)}
  .logobadge img{width:122px;height:122px;object-fit:contain}
  .brand{font-family:'Playfair Display',serif;font-weight:800;font-size:40px;margin-top:20px;letter-spacing:.5px;text-shadow:0 3px 14px rgba(0,0,0,.5)}
  .brand small{display:block;font-family:'Poppins';font-weight:600;font-size:19px;letter-spacing:.3em;opacity:.9;margin-top:6px}
  .nuevo{margin-top:36px;background:var(--rojo);font-weight:800;letter-spacing:.2em;font-size:26px;padding:16px 36px;border-radius:999px;box-shadow:0 10px 24px rgba(224,84,31,.4)}
  h1{font-family:'Playfair Display',serif;font-weight:900;font-size:128px;line-height:.9;margin-top:34px;text-shadow:0 6px 26px rgba(0,0,0,.5)}
  .sub{font-family:'Playfair Display',serif;font-style:italic;font-size:40px;margin-top:26px;opacity:.96}
  .chips{margin-top:50px;display:flex;flex-direction:column;gap:22px;width:100%;max-width:760px}
  .chip{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.4);border-radius:22px;padding:26px 30px;
    display:flex;align-items:center;gap:22px;font-size:30px;font-weight:600;text-align:left}
  .chip .ic{font-size:50px;flex:0 0 auto}
  .chip b{font-weight:800;color:#fff}
  .hours{margin-top:30px;font-size:30px;font-weight:600;letter-spacing:.04em;opacity:.95}
  .hours b{color:var(--dorado2)}
  .foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:16px}
  .pill{background:linear-gradient(90deg,var(--dorado),var(--dorado2));color:#3a2512;font-weight:800;font-size:40px;
    padding:28px 64px;border-radius:999px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .swipe{font-weight:700;font-size:30px;letter-spacing:.06em;display:flex;align-items:center;gap:14px}
  .arrow{font-size:40px;animation:none}
</style>
</head>
<body>
  <div class="bg"><img src="file:///C:/Users/Oficina1/.claude/jobs/51f3525a/tmp/club-mananas/marca/des-tostadas-tomate.webp"></div>
  <div class="scrim"></div>
  <div class="wrap">
    <div class="logobadge"><img src="file:///C:/Users/Oficina1/.claude/jobs/51f3525a/tmp/club-mananas/marca/elparaiso-logo.png"></div>
    <div class="brand">El Paraíso<small>BAR RESTAURANTE · PALMA</small></div>
    <div class="nuevo">NUEVO</div>
    <h1>El Club de<br>las Mañanas</h1>
    <div class="sub">El club de desayunos de El Paraíso</div>
    <div class="chips">
      <div class="chip"><span class="ic">🎟️</span><span>El <b>6º desayuno</b>, invita la casa</span></div>
      <div class="chip"><span class="ic">☕</span><span><b>Café incluido</b> con tu desayuno · socios L–V</span></div>
    </div>
    <div class="hours">☕ Mañanas de <b>8:00 a 12:30</b></div>
    <div class="foot">
      <div class="pill">Apúntate GRATIS</div>
      <div class="swipe"><span class="arrow">☝️</span> Desliza y hazte socio</div>
    </div>
  </div>
</body>
</html>
