<style>
  :root{--crema:#FBF4E8;--cafe:#361F12;--cafe2:#6F4A2E;--dorado:#C4852A;--dorado2:#E7B65A;--verde:#2E7D32;--rojo:#E0541F}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{font-family:'Poppins',sans-serif;color:var(--cafe);
    background:linear-gradient(160deg,#FCF6EC,#F3E2C5);position:relative}
  .top{display:flex;align-items:center;gap:20px;padding:46px 54px 24px}
  .logobadge{width:96px;height:96px;background:#fff;border-radius:50%;display:grid;place-items:center;
    box-shadow:0 8px 18px rgba(54,31,18,.14);border:3px solid rgba(196,133,42,.3);flex:0 0 auto}
  .logobadge img{width:78px;height:78px;object-fit:contain}

  .brand small{display:block;font-family:'Poppins';font-weight:600;font-size:16px;letter-spacing:.3em;color:var(--cafe2);margin-top:4px}
  .nuevo{margin-left:auto;background:var(--rojo);color:#fff;font-weight:800;letter-spacing:.18em;
    font-size:18px;padding:12px 22px;border-radius:999px;box-shadow:0 8px 18px rgba(224,84,31,.35)}
  .hero{margin:6px 54px 0;height:560px;border-radius:28px;overflow:hidden;position:relative;
    box-shadow:0 22px 48px rgba(54,31,18,.3);border:6px solid #fff}
  .hero img{width:100%;height:100%;object-fit:cover}
  .hero .scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(54,31,18,0) 40%,rgba(42,22,10,.72) 100%)}
  .hero .eyebrow{position:absolute;top:26px;left:28px;background:rgba(255,255,255,.92);color:var(--cafe);
    font-weight:700;letter-spacing:.12em;font-size:18px;padding:10px 20px;border-radius:999px}
  .hero h1{position:absolute;left:34px;right:34px;bottom:30px;color:#fff;font-family:'Playfair Display',serif;
    font-weight:900;font-size:76px;line-height:.96;text-shadow:0 4px 18px rgba(0,0,0,.4)}
  .benefits{display:flex;gap:22px;padding:34px 54px 0}
  .b{flex:1;background:#fff;border-radius:20px;padding:24px 22px;text-align:center;
    box-shadow:0 10px 22px rgba(54,31,18,.12);border:2px solid rgba(196,133,42,.22)}
  .b .ic{font-size:40px;line-height:1}
  .b .t{font-family:'Playfair Display',serif;font-weight:800;font-size:28px;margin-top:8px;line-height:1.08}
  .b .d{font-size:17px;color:var(--cafe2);margin-top:6px;font-weight:500}
  .cta{margin:30px 54px 0;background:linear-gradient(135deg,#3C2415,#6A4327);color:#FBEFD9;border-radius:22px;
    padding:26px 36px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 16px 34px rgba(54,31,18,.3)}
  .cta .big{font-family:'Playfair Display',serif;font-weight:800;font-size:46px;line-height:1}
  .cta .sm{font-size:19px;color:#EBD6B3;margin-top:8px;font-weight:500}
  .cta .sm b{color:#fff}
  .pill{background:linear-gradient(90deg,var(--dorado),var(--dorado2));color:#3a2512;font-weight:800;
    font-size:24px;padding:18px 28px;border-radius:999px;text-align:center;line-height:1.1;box-shadow:0 8px 18px rgba(196,133,42,.4)}
</style>
</head>
